name: Build Cross-Platform Releases (Windows, macOS, Linux)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag on critmaths/crit-mail-client-releases"
        required: false
        default: "v1.0.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: windows
            asset_name: CritMail-v1.0.0-win64.exe
          - os: macos-latest
            platform_name: macos
            asset_name: CritMail-v1.0.0-macOS.dmg
          - os: ubuntu-latest
            platform_name: linux
            asset_name: CritMail-v1.0.0-linux-x64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Qt6 system dependencies
        if: matrix.platform_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libgl1

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm CritMail.spec

      - name: Package Windows executable
        if: matrix.platform_name == 'windows'
        shell: pwsh
        run: |
          Copy-Item "dist/CritMail.exe" "${{ matrix.asset_name }}"

      - name: Package macOS .dmg Disk Image
        if: matrix.platform_name == 'macos'
        run: |
          mkdir -p dmg_staging
          cp -R "dist/CritMail.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "CritMail" -srcfolder dmg_staging -ov -format UDZO "${{ matrix.asset_name }}"

      - name: Package Linux .tar.gz archive
        if: matrix.platform_name == 'linux'
        run: |
          chmod +x dist/CritMail
          tar -czvf "${{ matrix.asset_name }}" -C dist CritMail

      - name: Upload build artifact to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      - name: Publish asset to public critmaths/crit-mail-client-releases repo
        if: env.GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
        shell: bash
        run: |
          TAG_NAME="${{ github.event.inputs.tag || 'v1.0.0' }}"
          gh release upload "$TAG_NAME" "${{ matrix.asset_name }}" --repo critmaths/crit-mail-client-releases --clobber
